<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>禄字交互｜西兰卡普动态字体</title>
  <script src="https://cdn.jsdelivr.net/npm/p5@1.9.4/lib/p5.min.js"></script>
  <style>
    html, body {
      margin: 0;
      padding: 0;
      width: 100%;
      min-height: 100%;
      background: #111;
      display: flex;
      justify-content: center;
      align-items: center;
      overflow: auto;
    }
    main {
      display: flex;
      justify-content: center;
      align-items: center;
      padding: 0;
    }
    canvas {
      display: block;
      max-width: 100vw;
      max-height: 100vh;
      width: auto !important;
      height: auto !important;
    }
    .hint {
      position: fixed;
      left: 12px;
      bottom: 10px;
      color: rgba(255,255,255,.55);
      font: 12px/1.4 -apple-system, BlinkMacSystemFont, "PingFang SC", sans-serif;
      letter-spacing: .02em;
      user-select: none;
      pointer-events: none;
    }
  </style>
</head>
<body>
<main></main>
<div class="hint">鼠标移动控制拉伸 / 收缩，按 G 开关网格</div>
<script>
const DESIGN_W = 426;
const DESIGN_H = 944;
let pattern = ["########..########", "########..########", "................##", "................##", "########..########", "########..########", "................##", "................##", "##.##.##..########", "##.##.##..########", "##.##.##.....##...", "##.##.##.....##...", "##.##.##..##.##.##", "##.##.##..##.##.##", "##.##.##..##.##.##", "##.##.##..##.##.##", "##.##.##..########", "##.##.##..########", "##.##.##..........", "##.##.##..........", "##.##.##..########", "##.##.##..########", "##.##.##..##.##.##", "##.##.##..##.##.##", "##.##.##..##.##.##", "##.##.##..##.##.##"];

let rows, cols;
let marginX = 0;
let marginY = 0;

let baseColW, baseRowH;
let colScale, rowScale, targetColScale, targetRowScale;
let colCenter, rowCenter, baseColCenter, baseRowCenter;
let colEdge, rowEdge, colW, rowH;
let colStretchBias, colCompressBias, rowStretchBias, rowCompressBias;

let ease = 0.22;
let velX = 0;
let velY = 0;
let velEase = 0.22;

let nearX = 78;
let midX  = 205;
let farX  = 500;
let baseMaxStretchX = 4.8;
let baseMinCompressX = 0.16;

let nearY = 78;
let midY  = 205;
let farY  = 610;
let baseMaxStretchY = 4.4;
let baseMinCompressY = 0.18;

let showGrid = true;

function setup() {
  const cnv = createCanvas(DESIGN_W, DESIGN_H);
  cnv.parent(document.querySelector('main'));
  smooth();
  rectMode(CORNER);
  ellipseMode(CENTER);
  noStroke();

  rows = pattern.length;
  cols = pattern[0].length;

  baseColW = (width - marginX * 2.0) / cols;
  baseRowH = (height - marginY * 2.0) / rows;

  colScale = new Array(cols).fill(1.0);
  rowScale = new Array(rows).fill(1.0);
  targetColScale = new Array(cols).fill(1.0);
  targetRowScale = new Array(rows).fill(1.0);

  colCenter = new Array(cols);
  rowCenter = new Array(rows);
  baseColCenter = new Array(cols);
  baseRowCenter = new Array(rows);

  colEdge = new Array(cols + 1);
  rowEdge = new Array(rows + 1);
  colW = new Array(cols);
  rowH = new Array(rows);

  colStretchBias = new Array(cols);
  colCompressBias = new Array(cols);
  rowStretchBias = new Array(rows);
  rowCompressBias = new Array(rows);

  buildBiases();
  updateBaseCenters();
  updateMappedCenters();
}

function draw() {
  updateMouseVelocity();
  let active = mouseInsideGraphic();

  updateTargets(active);
  updateScales();
  updateMappedCenters();

  drawGridBackground();

  if (showGrid) drawDynamicGrid();
  drawPatternDots();
}


function drawGridBackground() {
  noStroke();
  const palette = [
    color('#0029b3'), color('#09BC8A'), color('#f0fbff'),
    color('#F0F66E'), color('#CCE6F4'), color('#619FD1')
  ];
  background(palette[0]);
  let tx = constrain(mouseX / width, 0, 1);
  let ty = constrain(mouseY / height, 0, 1);

  for (let r = 0; r < rows; r++) {
    for (let c = 0; c < cols; c++) {
      let x = colEdge[c], y = rowEdge[r];
      let w = colEdge[c + 1] - colEdge[c];
      let h = rowEdge[r + 1] - rowEdge[r];
      let filled = pattern[r].charAt(c) === '#';

      let ca = palette[(r + c) % palette.length];
      let cb = palette[(r * 2 + c * 3 + 1) % palette.length];
      let cc = palette[(r * 5 + c + 2) % palette.length];

      let mixA = 0.10 + 0.80 * tx;
      let mixB = 0.10 + 0.80 * ty;
      let mixC = 0.5 + 0.5 * sin(frameCount * 0.012 + r * 0.45 + c * 0.38);

      let mix1 = lerpColor(ca, cb, mixA);
      let mix2 = lerpColor(mix1, cc, mixB * 0.45);
      let finalC = filled
        ? lerpColor(mix2, ca, 0.28 + 0.16 * mixC)
        : lerpColor(mix2, palette[5], 0.12 + 0.10 * mixC);

      fill(finalC);
      rect(x, y, w, h);
      drawCellWeave(x, y, w, h, finalC, palette, filled, r, c);
    }
  }
}


function drawCellWeave(x, y, w, h, baseC, palette, filled, rr, cc) {
  push();
  noStroke();

  let stripeCount = 3;
  let alpha1 = filled ? 24 : 12;
  let alpha2 = filled ? 20 : 10;

  let lightC = palette[(rr + cc + 1) % palette.length];
  let deepC  = palette[(rr * 2 + cc + 3) % palette.length];

  let stripeLight = lerpColor(baseC, lightC, filled ? 0.16 : 0.10);
  let stripeDark  = lerpColor(baseC, deepC,  filled ? 0.18 : 0.10);

  for (let i = 0; i < stripeCount; i++) {
    let yy = y + (i + 0.5) * h / stripeCount;
    let hh = h * 0.10;
    fill(red(stripeLight), green(stripeLight), blue(stripeLight), alpha1);
    rect(x, yy - hh * 0.5, w, hh);
  }

  for (let i = 0; i < stripeCount; i++) {
    let xx = x + (i + 0.5) * w / stripeCount;
    let ww = w * 0.10;
    fill(red(stripeDark), green(stripeDark), blue(stripeDark), alpha2);
    rect(xx - ww * 0.5, y, ww, h);
  }

  if ((rr + cc) % 2 === 0) {
    let centerBase = palette[(rr + cc + 4) % palette.length];
    let centerC = lerpColor(baseC, centerBase, filled ? 0.14 : 0.08);
    fill(red(centerC), green(centerC), blue(centerC), filled ? 20 : 8);
    rect(x + w * 0.30, y + h * 0.30, w * 0.40, h * 0.40);
  }

  pop();
}

function updateMouseVelocity() {
  let dx = mouseX - pmouseX;
  let dy = mouseY - pmouseY;
  velX = lerp(velX, dx, velEase);
  velY = lerp(velY, dy, velEase);
}

function buildBiases() {
  for (let c = 0; c < cols; c++) {
    let n1 = noise(c * 0.23 + 10.0);
    let n2 = noise(c * 0.31 + 80.0);
    let sWave = 0.5 + 0.5 * sin(c * 0.95 + 0.6);
    let cWave = 0.5 + 0.5 * cos(c * 0.57 + 1.3);
    colStretchBias[c] = constrain(0.55 + 0.75 * n1 + 0.45 * sWave, 0.55, 1.75);
    colCompressBias[c] = constrain(0.65 + 0.85 * n2 + 0.35 * cWave, 0.65, 1.95);
  }

  for (let r = 0; r < rows; r++) {
    let n1 = noise(r * 0.21 + 120.0);
    let n2 = noise(r * 0.29 + 200.0);
    let sWave = 0.5 + 0.5 * sin(r * 0.82 + 0.2);
    let cWave = 0.5 + 0.5 * cos(r * 0.51 + 1.1);
    rowStretchBias[r] = constrain(0.58 + 0.72 * n1 + 0.42 * sWave, 0.55, 1.70);
    rowCompressBias[r] = constrain(0.68 + 0.82 * n2 + 0.32 * cWave, 0.65, 1.90);
  }
}

function mouseInsideGraphic() {
  return mouseX >= -90 && mouseX <= width + 90 && mouseY >= -90 && mouseY <= height + 90;
}

function updateBaseCenters() {
  let totalW = cols * baseColW;
  let totalH = rows * baseRowH;
  let x0 = width * 0.5 - totalW * 0.5;
  let y0 = height * 0.5 - totalH * 0.5;

  for (let c = 0; c < cols; c++) baseColCenter[c] = x0 + baseColW * 0.5 + c * baseColW;
  for (let r = 0; r < rows; r++) baseRowCenter[r] = y0 + baseRowH * 0.5 + r * baseRowH;
}

function updateTargets(active) {
  if (!active) {
    for (let c = 0; c < cols; c++) targetColScale[c] = 1.0;
    for (let r = 0; r < rows; r++) targetRowScale[r] = 1.0;
    return;
  }

  let ax = abs(velX);
  let ay = abs(velY);
  let sum = ax + ay + 0.0001;
  let hDominance = ax / sum;
  let vDominance = ay / sum;
  let speed = sqrt(ax * ax + ay * ay);
  let idleBlend = constrain(map(speed, 0, 4, 0, 1), 0, 1);

  hDominance = lerp(0.5, hDominance, idleBlend);
  vDominance = lerp(0.5, vDominance, idleBlend);

  let maxStretchX = baseMaxStretchX * lerp(0.75, 1.45, hDominance);
  let maxStretchY = baseMaxStretchY * lerp(0.75, 1.45, vDominance);
  let minCompressX = lerp(0.30, baseMinCompressX, hDominance);
  let minCompressY = lerp(0.30, baseMinCompressY, vDominance);

  for (let c = 0; c < cols; c++) {
    let distX = abs(baseColCenter[c] - mouseX);
    let s = 1.0;

    if (distX <= nearX) {
      let t = smootherstep(1.0 - distX / nearX);
      let baseS = lerp(1.0, maxStretchX, t);
      s = 1.0 + (baseS - 1.0) * colStretchBias[c];
    } else if (distX <= midX) {
      let t = smootherstep(constrain((distX - nearX) / (midX - nearX), 0, 1));
      let baseS = lerp(maxStretchX, 1.0, t);
      let amp = lerp(colStretchBias[c], 1.0, t);
      s = 1.0 + (baseS - 1.0) * amp;
    } else if (distX <= farX) {
      let t = smootherstep(constrain((distX - midX) / (farX - midX), 0, 1));
      let baseS = lerp(1.0, minCompressX, t);
      s = 1.0 - (1.0 - baseS) * colCompressBias[c];
    } else {
      s = 1.0 - (1.0 - minCompressX) * colCompressBias[c];
    }
    targetColScale[c] = constrain(s, 0.05, maxStretchX * 1.15);
  }

  for (let r = 0; r < rows; r++) {
    let distY = abs(baseRowCenter[r] - mouseY);
    let s = 1.0;

    if (distY <= nearY) {
      let t = smootherstep(1.0 - distY / nearY);
      let baseS = lerp(1.0, maxStretchY, t);
      s = 1.0 + (baseS - 1.0) * rowStretchBias[r];
    } else if (distY <= midY) {
      let t = smootherstep(constrain((distY - nearY) / (midY - nearY), 0, 1));
      let baseS = lerp(maxStretchY, 1.0, t);
      let amp = lerp(rowStretchBias[r], 1.0, t);
      s = 1.0 + (baseS - 1.0) * amp;
    } else if (distY <= farY) {
      let t = smootherstep(constrain((distY - midY) / (farY - midY), 0, 1));
      let baseS = lerp(1.0, minCompressY, t);
      s = 1.0 - (1.0 - baseS) * rowCompressBias[r];
    } else {
      s = 1.0 - (1.0 - minCompressY) * rowCompressBias[r];
    }
    targetRowScale[r] = constrain(s, 0.05, maxStretchY * 1.15);
  }

  normalizeArray(targetColScale);
  normalizeArray(targetRowScale);
}

function updateScales() {
  for (let c = 0; c < cols; c++) colScale[c] = lerp(colScale[c], targetColScale[c], ease);
  for (let r = 0; r < rows; r++) rowScale[r] = lerp(rowScale[r], targetRowScale[r], ease);
  normalizeArray(colScale);
  normalizeArray(rowScale);
}

function updateMappedCenters() {
  for (let c = 0; c < cols; c++) colW[c] = baseColW * colScale[c];
  for (let r = 0; r < rows; r++) rowH[r] = baseRowH * rowScale[r];

  let totalW = colW.reduce((a, b) => a + b, 0);
  let totalH = rowH.reduce((a, b) => a + b, 0);
  let x0 = width * 0.5 - totalW * 0.5;
  let y0 = height * 0.5 - totalH * 0.5;

  colEdge[0] = x0;
  for (let c = 1; c <= cols; c++) colEdge[c] = colEdge[c - 1] + colW[c - 1];

  rowEdge[0] = y0;
  for (let r = 1; r <= rows; r++) rowEdge[r] = rowEdge[r - 1] + rowH[r - 1];

  for (let c = 0; c < cols; c++) colCenter[c] = (colEdge[c] + colEdge[c + 1]) * 0.5;
  for (let r = 0; r < rows; r++) rowCenter[r] = (rowEdge[r] + rowEdge[r + 1]) * 0.5;
}

function drawDynamicGrid() {
  stroke(255, 80);
  strokeWeight(0.7);
  for (let c = 0; c <= cols; c++) line(colEdge[c], rowEdge[0], colEdge[c], rowEdge[rows]);
  for (let r = 0; r <= rows; r++) line(colEdge[0], rowEdge[r], colEdge[cols], rowEdge[r]);

  if (true) {
    stroke(255, 140);
    strokeWeight(1.2);
    let nearestC = 0, bestX = 999999;
    for (let c = 0; c <= cols; c++) {
      let dd = abs(colEdge[c] - mouseX);
      if (dd < bestX) { bestX = dd; nearestC = c; }
    }
    let nearestR = 0, bestY = 999999;
    for (let r = 0; r <= rows; r++) {
      let dd = abs(rowEdge[r] - mouseY);
      if (dd < bestY) { bestY = dd; nearestR = r; }
    }
    line(colEdge[nearestC], rowEdge[0], colEdge[nearestC], rowEdge[rows]);
    line(colEdge[0], rowEdge[nearestR], colEdge[cols], rowEdge[nearestR]);
  }
  noStroke();
}


function drawPatternDots() {
  fill(0);
  noStroke();
  for (let r = 0; r < rows; r++) {
    for (let c = 0; c < cols; c++) {
      if (pattern[r].charAt(c) === '#') {
        ellipse(colCenter[c], rowCenter[r], colW[c], rowH[r]);
      }
    }
  }
}


function normalizeArray(arr) {
  let sum = arr.reduce((a, b) => a + b, 0);
  let avg = sum / arr.length;
  if (abs(avg) < 0.00001) avg = 1.0;
  for (let i = 0; i < arr.length; i++) arr[i] /= avg;
}

function smootherstep(x) {
  x = constrain(x, 0, 1);
  return x * x * x * (x * (x * 6 - 15) + 10);
}

function keyPressed() {
  if (key === 'g' || key === 'G') showGrid = !showGrid;
}
</script>
</body>
</html>
